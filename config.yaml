bot:
  name: "CryptoAlgoBot"
  environment: "development"
  log_level: "DEBUG" # DEBUG, INFO, WARNING, ERROR

trading:
  exchange: "binance" # binance, btcturk, paribu
  symbols: []
  timeframes:
    - "1m"
    - "5m"
    - "1h"

risk_management:
  max_risk_per_trade_percent: 0.2
  max_open_positions: 5
  default_leverage: 1
  max_leverage: 50
  max_consecutive_losses: 5


strategy:
  active_modules:
    - "trend_following"
    - "mean_reversion"
  ml_confidence_threshold: 0.60


# ============================================
# ML MODEL AYARLARI (XGBoost)
# ============================================
ml:
  enabled: true
  # model_path: Dinamik olarak oluşturulur (symbol + timeframe)
  confidence_threshold: 0.65
  # Dinamik kaldıraç eşikleri
  leverage:
    strong_threshold: 0.80  # ≥80% -> 10x kaldıraç
    normal_threshold: 0.65  # 65-79% -> 3x kaldıraç
    weak_threshold: 0.50    # <65% -> 1x kaldıraç (veya işlem yok)


# ============================================
# WFO (Walk-Forward Optimization) AYARLARI
# ============================================
wfo:
  enabled: true  # WFO motorunu aktif et
  train_days: 30  # In-Sample eğitim penceresi (gün)
  test_days: 7  # Out-of-Sample test penceresi (gün)
  reoptimize_interval: 168  # Yeniden optimizasyon sıklığı (saat) - 168 = 1 hafta
  min_improvement: 0.05  # Minimum iyileştirme (%) - %5
  optimization_metric: "sharpe"  # sharpe, net_pnl, veya sortino


# ============================================
# HTF (Higher Timeframe) AYARLARI
# ============================================
htf:
  enabled: true
  # Altın Oran (1:4 / 1:6) prensibi - Dinamik haritalama
  # Her timeframe için 2 HTF seviyesi: [Minor (mikro trend), Major (makro trend)]
  dynamic_map:
    '1m':  ['5m', '15m']   # Mikro: 5m (1:5), Makro: 15m (1:15)
    '3m':  ['15m', '1h']   # Mikro: 15m (1:5), Makro: 1h (1:20)
    '5m':  ['15m', '1h']   # Mikro: 15m (1:3), Makro: 1h (1:12)
    '15m': ['1h', '4h']    # Mikro: 1h (1:4), Makro: 4h (1:16)
    '30m': ['2h', '6h']    # Mikro: 2h (1:4), Makro: 6h (1:12)
    '1h':  ['4h', '1d']    # Mikro: 4h (1:4), Makro: 1d (1:24)
    '4h':  ['1d', '1w']    # Mikro: 1d (1:6), Makro: 1w (1:7)

  # Trend tespit metodu
  trend_method: "ema_stack"  # ema_stack, close_ema, adx_filter

  # EMA Stack için parametreler
  ema_fast: 20
  ema_slow: 50

  # Filtre kuralları
  filter_rules:
    require_all_htf_agree: false  # Tüm HTF'ler aynı yönde olmalı mı?
    # major_htf: Dinamik olarak htf_levels[-1] olacak (hardcoded değil)


